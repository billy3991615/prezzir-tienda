<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prezzir - Tienda Online</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

#welcomePage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 400px;
}

.logo {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 30px;
}

.logo-p {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, #FFD700 0%, #FFC800 100%);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 24px;
  color: #333;
}

.logo-text {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 1px;
}

.logo-text .p { color: #FF2D78; }
.logo-text .r { color: #00E0A8; }

h1 {
  font-size: 32px;
  margin-bottom: 10px;
  text-align: center;
  color: #333;
}

h1 .highlight {
  color: #00E0A8;
}

.subtitle {
  color: #666;
  font-size: 14px;
  text-align: center;
  margin-bottom: 40px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

input {
  padding: 12px;
  border: 1.5px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}

input:focus {
  outline: none;
  border-color: #FF2D78;
}

button {
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-primary {
  background: linear-gradient(135deg, #FF2D78 0%, #E91E63 100%);
  color: white;
  width: 100%;
  margin-bottom: 10px;
}

.btn-primary:hover {
  transform: translateY(-2px);
}

.btn-secondary {
  background: #f5f5f5;
  color: #666;
  width: 100%;
}

.error {
  color: #FF2D78;
  font-size: 13px;
  font-weight: 600;
  min-height: 18px;
  margin-top: 10px;
}

#loginForm { display: block; }
#registerForm { display: none; }
</style>
</head>
<body>

<div id="welcomePage">
  <div class="logo">
    <div class="logo-p">P</div>
    <div class="logo-text"><span class="p">P</span>REZZI<span class="r">R</span></div>
  </div>
  
  <h1>Bienvenido a <span class="highlight">Prezzir</span></h1>
  <p class="subtitle">Descubre moda, accesorios y mucho más al mejor precio</p>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
    </div>
    <button type="submit" class="btn-primary">Ingresar</button>
    <button type="button" class="btn-secondary" onclick="switchToRegister()">Crear cuenta</button>
    <div id="loginError" class="error"></div>
  </form>

  <form id="registerForm" onsubmit="handleRegister(event)">
    <div class="form-group">
      <input type="text" id="registerName" placeholder="Nombre completo" required>
      <input type="email" id="registerEmail" placeholder="Correo electrónico" required>
      <input type="password" id="registerPassword" placeholder="Contraseña (mín. 6)" required>
      <input type="password" id="registerPasswordConfirm" placeholder="Confirmar contraseña" required>
    </div>
    <button type="submit" class="btn-primary">Crear cuenta</button>
    <button type="button" class="btn-secondary" onclick="switchToLogin()">Volver</button>
    <div id="registerError" class="error"></div>
  </form>
</div>

<div id="catalogPage" style="display:none; width:100%; padding:20px;">
  <h1>Catálogo (En construcción)</h1>
  <p>Aquí irán los productos...</p>
</div>

<script>
// Esperar a que Supabase esté disponible
async function initSupabase() {
  if (!window.supabase) {
    console.error('Supabase no cargó');
    return;
  }
  
  const SUPABASE_URL = "https://iptecxrdfxgmpcrhdykc.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwdGVjeHJkZnhnbXBjcmhkeWtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTI4MTEwMDAsImV4cCI6MTkyNDM0NzAwMH0.sb_publishable_wEiXBT1c7YSU_MwifDZLaA_f47zFV5a";

  window.db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

// Inicializar cuando esté listo
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initSupabase);
} else {
  initSupabase();
}

function switchToRegister() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
}

function switchToLogin() {
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('loginError').textContent = '';
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const errorDiv = document.getElementById('loginError');
  
  if (!window.db) {
    errorDiv.textContent = 'Error: No se conectó a la base de datos';
    return;
  }
  
  errorDiv.textContent = 'Conectando...';
  
  try {
    const { data, error } = await window.db.auth.signInWithPassword({
      email, password
    });
    
    if (error) {
      errorDiv.textContent = 'Email o contraseña incorrectos';
      return;
    }
    
    if (data.user) {
      document.getElementById('welcomePage').style.display = 'none';
      document.getElementById('catalogPage').style.display = 'block';
      alert('¡Bienvenido ' + email + '!');
    }
  } catch (err) {
    errorDiv.textContent = 'Error: ' + err.message;
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const name = document.getElementById('registerName').value;
  const email = document.getElementById('registerEmail').value;
  const password = document.getElementById('registerPassword').value;
  const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
  const errorDiv = document.getElementById('registerError');
  
  if (password !== passwordConfirm) {
    errorDiv.textContent = 'Las contraseñas no coinciden';
    return;
  }
  
  if (password.length < 6) {
    errorDiv.textContent = 'Mínimo 6 caracteres';
    return;
  }
  
  if (!window.db) {
    errorDiv.textContent = 'Error: No se conectó a la base de datos';
    return;
  }
  
  errorDiv.textContent = 'Creando cuenta...';
  
  try {
    const { data, error } = await window.db.auth.signUp({
      email,
      password,
      options: {
        data: { full_name: name }
      }
    });
    
    if (error) {
      errorDiv.textContent = 'Error: ' + error.message;
      return;
    }
    
    if (data.user) {
      document.getElementById('welcomePage').style.display = 'none';
      document.getElementById('catalogPage').style.display = 'block';
      alert('¡Cuenta creada! Bienvenido ' + name + '!');
    }
  } catch (err) {
    errorDiv.textContent = 'Error: ' + err.message;
  }
}
</script>

</body>
</html>
